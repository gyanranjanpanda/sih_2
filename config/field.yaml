  srp.vfd_base_frequency_hz: {assumed: true, source: "Indian grid frequency.", confidence: high}
  srp.hydraulic_max_pressure_kpa: {assumed: true, source: "Typical hydraulic long-stroke unit working pressure.", confidence: low}
  srp.hydraulic_max_flow_m3_per_s: {assumed: true, source: "Typical hydraulic power unit flow rating.", confidence: low}
