  srp.steel_youngs_modulus_pa: {assumed: false, source: "Physical constant for carbon steel.", confidence: high}
  srp.damping_factor_dimensionless: {assumed: true, source: "Gibbs dimensionless damping typically 0.05-0.5; heavy-oil value used and calibrated per well.", confidence: medium}
  srp.damping_viscosity_exponent: {assumed: true, source: "Exponent linking damping to viscosity at pump; calibrated.", confidence: low}
  srp.damping_factor_max: {assumed: true, source: "Numerical bound to keep the wave solver stable.", confidence: high}
  srp.wave_grid_nodes_per_section: {assumed: true, source: "Numerical discretization, chosen by convergence test.", confidence: high}
  srp.wave_time_steps_per_cycle: {assumed: true, source: "Numerical discretization, chosen by CFL and convergence test.", confidence: high}
  srp.rod_sections: {assumed: true, source: "Unknown taper. 7/8 in over 3/4 in API Grade D is a defensible heavy-oil design at 1100 m.", confidence: low}
